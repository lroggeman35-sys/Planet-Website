<html>
  <head>
    <title>Venus</title>
    <style>
      body {
        background-color: black;
        color: white;
        text-align: center;
        font-family: 'Trebuchet MS', Helvetica, sans-serif;
        margin: 40px 20px;
      }
      
      /* Smaller, highly transparent orangish box */
      .content-box {
        background-color: rgba(255, 120, 50, 0.1); /* Very subtle transparency */
        border: 1px solid rgba(255, 140, 60, 0.25);
        padding: 10px 18px;
        margin: 15px auto;
        max-width: 450px;
        border-radius: 8px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 1px;
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
      }

      img {
        display: block;
        margin: 20px auto;
        max-width: 250px;
      }

      a {
        color: #ffb07c;
        text-decoration: none;
        font-size: 14px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="content-box">
      <h1>Venus</h1>
    </div>

    <div class="content-box">
      <p>This site is about the planet Venus. Here's a neat fact: Venus is the hottest planet in our solar system and the only one that truly spins clockwise.</p>
    </div>

    <img src="venus.gif" alt="A rotating image of venus" />
    
    <div class="content-box" style="display: inline-block;">
      <a href="https://science.nasa.gov/venus/venus-facts/" target="_blank">Click here for more venus facts!</a>
    </div>
  </body>
</html>
